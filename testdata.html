<style>
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font:.9rem var(--f-mono);color:var(--accent-text);text-decoration:none}
.back-link:hover{text-decoration:underline}

.td-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:18px;margin-bottom:24px;border-radius:var(--r);background:var(--surface-strong);border:1px solid var(--line-bright)}
.td-bar label{flex:1;min-width:180px}
.td-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.td-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:12px;align-content:start}
.td-panel h2{margin:0;font-size:1.18rem}

.td-item{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bg-2) 78%,transparent);border:1px solid var(--line)}
.td-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.td-label{font:600 .8rem var(--f-mono);color:var(--muted)}
.td-val{font:.84rem var(--f-mono);color:var(--text);word-break:break-all;max-height:76px;overflow:auto;user-select:all}
.copy-btn{min-height:32px;padding:0 12px;font-size:.8rem}
.copy-btn.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

@media(max-width:860px){.td-grid{grid-template-columns:1fr}}
</style>

<script src="fx3d.js" defer></script>
<script>
(function () {
  var grid = document.getElementById("td-grid");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function copyText(text, btn) {
    function done() {
      var old = btn.textContent;
      btn.textContent = "Copied!";
      btn.classList.add("ok");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("ok"); }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  }

  function makeRand() {
    var id = Math.random().toString(36).slice(2, 8);
    var ts = Date.now();
    return [
      { label: "Unique QA Email", val: "qa+" + id + "." + (ts % 1000) + "@example.com" },
      { label: "UUID v4-style ID", val: "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); }) },
      { label: "Random Username", val: "qa_user_" + id },
      { label: "ISO Timestamp", val: new Date().toISOString() }
    ];
  }

  function getGroups() {
    return [
      {
        title: "1. Boundary & Whitespace",
        items: [
          { label: "Whitespace Only (3 spaces)", val: "   " },
          { label: "Leading & Trailing Spaces", val: "  test_user  " },
          { label: "Exact 255 Characters", val: "A".repeat(255) },
          { label: "256 Characters (Overflow)", val: "B".repeat(256) },
          { label: "1,000 Characters", val: "QA12345678".repeat(100) }
        ]
      },
      {
        title: "2. Security & Injection Probes",
        items: [
          { label: "Basic XSS Script", val: "<script>alert(1)<\/script>" },
          { label: "IMG Onerror XSS", val: "<img src=x onerror=alert(1)>" },
          { label: "SQL Injection Bypass", val: "' OR '1'='1" },
          { label: "Path Traversal", val: "../../etc/passwd" },
          { label: "JSON Breaking Quote", val: '{"key": "val\\"ue"}' }
        ]
      },
      {
        title: "3. Unicode, Emoji & Symbols",
        items: [
          { label: "Bangla UTF-8", val: "বাংলা টেক্সট পরীক্ষামূলক ইনপুট" },
          { label: "Emoji Family & Symbols", val: "👨‍👩‍👧‍👦🔥✅🚀" },
          { label: "Arabic RTL Text", val: "اختبار النص العربي" },
          { label: "All Special Symbols", val: "!@#$%^&*()_+-=[]{}|;':\",./<>?" }
        ]
      },
      {
        title: "4. Emails, Dates & Numbers",
        items: [
          { label: "Valid Plus-Tag Email", val: "qa+test.01@sub-domain.example.co.uk" },
          { label: "Invalid Double-@ Email", val: "qa@@example..com" },
          { label: "Leap Year Date", val: "2024-02-29" },
          { label: "Invalid Non-Leap Feb 29", val: "2025-02-29" },
          { label: "Max 32-bit Int", val: "2147483647" },
          { label: "Zero & Negative", val: "-1" },
          { label: "BD Phone Format", val: "+8801712345678" }
        ]
      },
      {
        title: "5. Fresh Random Values",
        items: makeRand()
      }
    ];
  }

  function render() {
    var groups = getGroups();
    grid.innerHTML = groups.map(function (g, gi) {
      return '<section class="td-panel"><h2>' + esc(g.title) + "</h2>" + g.items.map(function (it, ii) {
        return '<div class="td-item"><div class="td-top"><span class="td-label">' + esc(it.label) +
          '</span><button class="btn sm copy-btn" type="button" data-g="' + gi + '" data-i="' + ii + '">Copy</button></div>' +
          '<code class="td-val">' + esc(it.val) + "</code></div>";
      }).join("") + "</section>";
    }).join("");
    grid._groups = groups;
  }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest(".copy-btn");
    if (!b) return;
    var item = grid._groups[b.dataset.g].items[b.dataset.i];
    copyText(item.val, b);
  });

  document.getElementById("gen-len").addEventListener("click", function () {
    var n = Math.max(1, Math.min(10000, Number(document.getElementById("len-in").value) || 256));
    copyText("X".repeat(n), this);
  });

  document.getElementById("regen-rand").addEventListener("click", render);
  render();
})();
</script>
</body>
